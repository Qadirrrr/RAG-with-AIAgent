services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rag_saas
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_password_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_saas"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://rag:rag_password_change_me@db:5432/rag_saas
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
      - uploads_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  chroma_data:
  uploads_data:
